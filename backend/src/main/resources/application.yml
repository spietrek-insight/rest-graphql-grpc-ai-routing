spring:
  application:
    name: protocol-studio
  threads:
    virtual:
      enabled: true
  mvc:
    async:
      request-timeout: 180000
  web:
    error:
      include-message: never
  grpc:
    server:
      port:${GRPC_PORT:9090}
    client:
      channel:
        tracker:
          target: static://127.0.0.1:${GRPC_PORT:9090}

server:
  port: ${PORT:8080}
router:
  warmup: ${AI_WARMUP:true}
  provider: ${AI_PROVIDER:ollama}
  ollama-url: ${OLLAMA_URL:http://localhost:11434}
  model: ${AI_MODEL:}
  ollama-model: ${OLLAMA_MODEL:}
  jev-model: ${JEV_MODEL:}
  clm-url: ${CLM_URL:}
  clm-key: ${CLM_API_KEY:}
  clm-model: ${CLM_MODEL:}
  typesafe-url: ${TYPESAFE_URL:https://api.typesafe.ai}
  typesafe-key: ${TYPESAFE_API_KEY:}
management:
  endpoints:
    web:
      exposure:
        include: health
