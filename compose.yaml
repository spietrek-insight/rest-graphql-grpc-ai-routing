services:
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      AI_WARMUP: ${AI_WARMUP:-true}
      AI_MODEL: ${AI_MODEL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      JEV_MODEL: ${JEV_MODEL:-}
      CLM_MODEL: ${CLM_MODEL:-}
      CLM_URL: ${CLM_URL:-}
      CLM_API_KEY: ${CLM_API_KEY:-}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
  ollama:
    image: ollama/ollama:0.34.4
    environment:
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - model-data:/root/.ollama
    restart: unless-stopped
  model-init:
    image: ollama/ollama:0.34.4
    environment:
      OLLAMA_HOST: http://ollama:11434
      AI_MODEL: ${AI_MODEL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'model="$${OLLAMA_MODEL:-qwen3:4b-instruct-2507-q4_K_M}"; if [ "$$AI_PROVIDER" = "ollama" ] && [ -z "$$OLLAMA_MODEL" ] && [ -n "$$AI_MODEL" ]; then model="$$AI_MODEL"; fi; until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull "$$model"'
    depends_on:
      - ollama
    restart: on-failure:3
volumes:
  model-data:
